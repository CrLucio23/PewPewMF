<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${ticket.oggetto + ' | Supporto PEWPEW MF'}">Ticket | PEWPEW MF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" th:href="@{/images/logo-pewpew.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
</head>
<body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="discovery-shell">
    <nav class="discovery-breadcrumb" aria-label="Percorso"><a th:href="@{/ticket}">Centro supporto</a></nav>
    <header class="discovery-heading"><h1 class="ticket-title" th:text="${ticket.oggetto}"></h1><p th:text="${ticket.codiceTicket}"></p><span class="ticket-status" th:classappend="${'status-' + ticket.stato}" th:text="${ticket.stato}"></span></header>
    <p class="feedback-error" th:if="${errore != null}" th:text="${errore}" role="alert"></p>
    <p class="feedback-success" th:if="${conferma != null}" th:text="${conferma}" role="status"></p>
    <div class="support-layout">
        <section aria-labelledby="thread-title">
            <h2 id="thread-title">Conversazione</h2>
            <div class="ticket-thread">
                <article class="ticket-message" th:each="messaggio : ${ticket.messaggi}" th:classappend="${messaggio.rispostaStaff} ? 'staff-message'">
                    <header><strong th:text="${messaggio.autore.username}"></strong><span th:if="${messaggio.rispostaStaff}" class="staff-label">Staff supporto</span><time th:datetime="${messaggio.dataInvio}" th:text="${#temporals.format(messaggio.dataInvio,'dd/MM/yyyy HH:mm')}"></time></header>
                    <p class="message-text" th:text="${messaggio.testo}"></p>
                </article>
            </div>
            <form th:if="${ticket.stato.name() != 'CHIUSO'}" method="post" th:action="@{/ticket/{id}/rispondi(id=${ticket.id})}" class="stack-form reply-form">
                <div><label for="testo">La tua risposta</label><textarea id="testo" name="testo" rows="5" th:text="${testo}" required></textarea></div>
                <button type="submit" class="primary-button">Invia risposta</button>
            </form>
            <p class="empty-results" th:if="${ticket.stato.name() == 'CHIUSO'}">Ticket chiuso. Puoi aprire un nuovo ticket dal centro supporto.</p>
        </section>
        <aside class="support-form-panel" aria-labelledby="ticket-info-title">
            <h2 id="ticket-info-title">Dettagli ticket</h2>
            <dl class="ticket-info"><div><dt>Operatore</dt><dd th:text="${ticket.utente.username}"></dd></div><div><dt>Categoria</dt><dd th:text="${ticket.categoria}"></dd></div><div><dt>Priorità</dt><dd th:text="${ticket.priorita}"></dd></div><div><dt>Apertura</dt><dd th:text="${#temporals.format(ticket.dataApertura,'dd/MM/yyyy HH:mm')}"></dd></div></dl>
            <form th:if="${staff}" method="post" th:action="@{/ticket/{id}/stato(id=${ticket.id})}" class="stack-form">
                <div><label for="stato">Aggiorna stato</label><select id="stato" name="stato"><option th:each="valore : ${stati}" th:value="${valore}" th:text="${valore}" th:selected="${valore == ticket.stato}"></option></select></div>
                <button type="submit" class="primary-button">Aggiorna stato</button>
            </form>
        </aside>
    </div>
</main>
<script th:replace="~{catalogo :: pageScripts}"></script>
</body></html>
