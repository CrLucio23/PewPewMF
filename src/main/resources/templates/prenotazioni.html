<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prenota una sessione | PEWPEW MF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" th:href="@{/images/logo-pewpew.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
</head>
<body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="discovery-shell">
    <header class="discovery-heading">
        <h1>Prenota una sessione</h1>
        <p>Scegli la prossima partita. Porta il tuo equipaggiamento o noleggia quello che ti serve.</p>
    </header>
    <p th:if="${errore != null}" th:text="${errore}" class="booking-error" role="alert"></p>
    <section aria-labelledby="sessions-title">
        <h2 id="sessions-title">Prossime sessioni</h2>
        <div class="session-grid">
            <p th:if="${#lists.isEmpty(sessioni)}" class="empty-results">Nessuna sessione futura con posti disponibili al momento.</p>
            <article class="session-card" th:each="sessione : ${sessioni}">
                <div class="session-card-body">
                    <time class="session-date" th:datetime="${sessione.dataOraInizio}"
                          th:text="${#temporals.format(sessione.dataOraInizio, 'dd/MM/yyyy · HH:mm')}"></time>
                    <h3 th:text="${sessione.titolo}"></h3>
                    <p class="session-field" th:text="${sessione.campo}"></p>
                    <p th:text="${sessione.descrizione}"></p>
                    <p><span th:text="${sessione.durataOre}"></span> ore di gioco</p>
                    <span class="seats-badge" th:classappend="${sessione.postiDisponibili <= 5} ? 'seats-low'"
                          th:text="${sessione.postiDisponibili + ' posti rimasti'}"></span>
                    <p class="session-base-price">Quota base <strong th:text="${#numbers.formatDecimal(sessione.prezzoBaseSessione,1,'POINT',2,'COMMA') + ' €'}"></strong></p>
                    <a class="primary-button" th:href="@{/prenotazioni/sessione/{id}(id=${sessione.id})}">Configura &amp; Prenota</a>
                </div>
            </article>
        </div>
    </section>
</main>
<script th:replace="~{catalogo :: pageScripts}"></script>
</body>
</html>
