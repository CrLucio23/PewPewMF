<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${partner.nome + ' | PEWPEW MF'}">Partner | PEWPEW MF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="discovery-shell">
    <nav class="discovery-breadcrumb" aria-label="Percorso"><a th:href="@{/partner}">Partner Ufficiali</a></nav>
    <header class="partner-profile discovery-heading">
        <div class="partner-logo">
            <img th:if="${!#strings.isEmpty(partner.logoUrl)}" th:src="${partner.logoUrl}"
                 th:alt="${'Logo ' + partner.nome}" data-discovery-image>
            <span th:hidden="${!#strings.isEmpty(partner.logoUrl)}" th:text="${partner.nome}"></span>
        </div>
        <div>
            <h1 th:text="${partner.nome}"></h1>
            <p class="partner-category" th:text="${partner.categoriaPartner}"></p>
            <p th:text="${partner.descrizione}"></p>
            <dl class="partner-counts">
                <div><dt>Attrezzature</dt><dd th:text="${#lists.size(attrezzature)}">0</dd></div>
                <div><dt>Eventi</dt><dd th:text="${#lists.size(eventi)}">0</dd></div>
            </dl>
            <div class="profile-actions">
                <a class="primary-button" th:href="@{/catalogo(partnerId=${partner.id})}">Vai al catalogo del partner</a>
                <a class="outline-button" href="#eventi">Eventi del partner</a>
            </div>
        </div>
    </header>
    <section class="discovery-section" aria-labelledby="equipment-title">
        <h2 id="equipment-title">Attrezzatura a catalogo</h2>
        <div th:replace="~{catalogo :: griglia(${attrezzature})}"></div>
    </section>
    <section id="eventi" class="discovery-section" aria-labelledby="events-title">
        <h2 id="events-title">Eventi &amp; Operazioni Speciali</h2>
        <div th:replace="~{partner-eventi :: eventi(${eventi})}"></div>
    </section>
</main>
<script th:replace="~{catalogo :: pageScripts}"></script>
</body>
</html>
