<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione | PEWPEW MF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" th:href="@{/images/logo-pewpew.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
</head>
<body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="discovery-shell auth-shell">
    <section class="auth-card" aria-labelledby="register-title">
        <a class="auth-brand" th:href="@{/}" aria-label="PEWPEW MF — Home">
            <img th:src="@{/images/logo-pewpew.png}" alt="" width="56" height="56"><span>PEWPEW MF</span>
        </a>
        <h1 id="register-title">Registrati</h1>
        <p>Crea il tuo account operatore.</p>
        <form method="post" th:action="@{/registrazione}" th:object="${registrazione}" class="stack-form">
            <div class="feedback-error" th:if="${#fields.hasAnyErrors()}" role="alert">
                <p>Controlla i dati inseriti. La password deve contenere da 8 a 72 caratteri.</p>
                <p th:each="errore : ${#fields.globalErrors()}" th:text="${errore}"></p>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-pair">
                <div><label for="nome">Nome</label><input id="nome" th:field="*{nome}" autocomplete="given-name" maxlength="255"></div>
                <div><label for="cognome">Cognome</label><input id="cognome" th:field="*{cognome}" autocomplete="family-name" maxlength="255"></div>
            </div>
            <div><label for="username">Username</label><input id="username" th:field="*{username}" autocomplete="username" maxlength="255" required></div>
            <div><label for="email">Email</label><input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="255" required></div>
            <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-help" required>
                <p id="password-help" class="field-help">Da 8 a 72 caratteri, entro 72 byte UTF-8.</p></div>
            <button class="primary-button" type="submit">Crea account</button>
        </form>
        <p class="auth-alternative">Hai già un account? <a class="detail-link" th:href="@{/login}">Accedi</a></p>
    </section>
</main>
<script th:replace="~{catalogo :: pageScripts}"></script>
</body></html>
