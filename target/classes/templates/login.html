<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accedi | PEWPEW MF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" th:href="@{/images/logo-pewpew.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
</head>
<body>
<a class="skip-link" href="#main-content">Vai al contenuto</a>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main id="main-content" class="discovery-shell auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
        <a class="auth-brand" th:href="@{/}">
            <img th:src="@{/images/logo-pewpew.png}" alt="" width="56" height="56"><span>PEWPEW MF</span>
        </a>
        <h1 id="login-title">Accedi</h1>
        <p>Ritrova ordini, prenotazioni e supporto nel tuo account.</p>
        <p class="feedback-error" th:if="${param.error != null}" role="alert">Username o password non corretti.</p>
        <p class="feedback-success" th:if="${param.registrazioneSuccess != null}" role="status">Registrazione completata. Ora puoi accedere.</p>
        <form method="post" th:action="@{/login}" class="stack-form">
            <div><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus></div>
            <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="primary-button" type="submit">Accedi al tuo account</button>
        </form>
        <p class="auth-alternative">Nuovo operatore? <a class="detail-link" th:href="@{/registrazione}">Registrati</a></p>
        <a class="detail-link" th:href="@{/carrello}">Torna al carrello</a>
    </section>
</main>
<script th:replace="~{catalogo :: pageScripts}"></script>
</body></html>
